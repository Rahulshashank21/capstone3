name: TelcoLane CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Architectural Isolation Audit
        run: |
          bash .claude/hooks/architecture-layering-check.sh
          bash .claude/hooks/pii-masking-check.sh

      - name: Invariant Safety Hooks
        run: |
          bash .claude/hooks/pro-rata-invariant-check.sh
          bash .claude/hooks/plan-immutability-check.sh

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=src --cov-report=xml:coverage.xml tests/

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Claude Code Quality Review Gate
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'
